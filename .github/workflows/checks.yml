name: Site checks

# Runs the same checkers the project runs locally, so what GitHub reports is the
# real gate and not a separate, drifting copy. The second job tests the checks
# themselves: it plants known defects and fails if the checker misses one.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run static checks
        run: node .github/checks/check-static.mjs

  self-test:
    name: Checker self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Plant known defects and require the checker to catch each one
        run: node .github/checks/mutation-test.mjs

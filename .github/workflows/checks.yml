name: Site checks

# Runs the same checker the project runs locally, so the check GitHub reports
# is the real gate and not a separate, drifting copy.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run static checks
        run: node .github/checks/check-static.mjs
